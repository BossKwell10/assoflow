openapi: 3.1.0
info:
  title: AssoFlow CI — API
  version: 1.0.0
  description: 'API du backend AssoFlow (console web et app mobile). Conventions : voir docs/07-contrat-api.md. Toutes les
    routes sont préfixées par /v1. Montants en FCFA entiers. Dates ISO 8601 UTC.'
servers:
- url: https://api.assoflow.ci/v1
  description: Production
- url: https://api.staging.assoflow.ci/v1
  description: Staging
- url: http://localhost:3000/v1
  description: Local
security:
- bearer: []
tags:
- name: Authentification
- name: Association
- name: Accès et rôles
- name: Membres
- name: Cotisations
- name: Trésorerie
- name: Dépenses
- name: Fichiers
- name: Projets
- name: Réunions
- name: Communication
- name: Rapports
- name: Espace membre
- name: Synchronisation
- name: Support
- name: Public
- name: Plateforme
- name: Santé
paths:
  /auth/otp/demander:
    post:
      tags:
      - Authentification
      summary: Demander un code OTP par SMS
      operationId: post_auth_otp_demander
      description: 'Exigences : RF-001, RF-004.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telephone:
                  type: string
                  pattern: ^\+[1-9][0-9]{7,14}$
                  description: Téléphone E.164
                  example: '+2250701020304'
                but:
                  type: string
                  enum:
                  - inscription
                  - connexion
                  - reinitialisation
                  - confirmation_appareil
              required:
              - telephone
              - but
      responses:
        '204':
          description: Succès sans contenu (même réponse si le numéro n'a pas de compte ; aucun SMS n'est alors envoyé)
        '422':
          $ref: '#/components/responses/Invalide'
        '429':
          $ref: '#/components/responses/TropDeRequetes'
        default:
          $ref: '#/components/responses/Erreur'
      security: []
  /auth/otp/verifier:
    post:
      tags:
      - Authentification
      summary: Vérifier un code OTP
      operationId: post_auth_otp_verifier
      description: 'Exigences : RF-001.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telephone:
                  type: string
                  pattern: ^\+[1-9][0-9]{7,14}$
                  description: Téléphone E.164
                  example: '+2250701020304'
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                but:
                  type: string
              required:
              - telephone
              - code
              - but
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  jetonOtp:
                    type: string
                  expireDans:
                    type: integer
                required:
                - jetonOtp
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
      security: []
  /auth/mot-de-passe:
    post:
      tags:
      - Authentification
      summary: Définir ou réinitialiser le mot de passe (après OTP)
      operationId: post_auth_mot_de_passe
      description: 'Exigences : RF-004, RF-SUP-053, RF-SUP-054. Le jeton OTP (but `inscription` ou `reinitialisation`)
        est à usage unique. À la première définition (ou à un changement de version des textes), `accepteCgu` et
        `accepteTraitementDonnees` doivent valoir true (sinon 422 VALIDATION). Révoque toutes les sessions.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jetonOtp:
                  type: string
                motDePasse:
                  type: string
                  minLength: 10
                accepteCgu:
                  type: boolean
                  description: Acceptation des CGU (version courante)
                accepteTraitementDonnees:
                  type: boolean
                  description: Consentement au traitement des données personnelles
                canal:
                  type: string
                  enum:
                  - console
                  - mobile
                  description: Canal de recueil du consentement (défaut mobile)
              required:
              - jetonOtp
              - motDePasse
      responses:
        '204':
          description: Succès sans contenu
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
      security: []
  /auth/connexion:
    post:
      tags:
      - Authentification
      summary: Se connecter
      operationId: post_auth_connexion
      description: 'Exigences : RF-002, RF-003, RF-005.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiant:
                  type: string
                  description: Téléphone E.164 ou email
                motDePasse:
                  type: string
                canal:
                  type: string
                  enum:
                  - console
                  - mobile
              required:
              - identifiant
              - motDePasse
              - canal
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Session'
                - $ref: '#/components/schemas/EtapeTotp'
        '423':
          $ref: '#/components/responses/Verrouille'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
      security: []
  /auth/totp:
    post:
      tags:
      - Authentification
      summary: Second facteur TOTP
      operationId: post_auth_totp
      description: 'Exigences : RF-003.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jetonIntermediaire:
                  type: string
                code:
                  type: string
              required:
              - jetonIntermediaire
              - code
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '423':
          $ref: '#/components/responses/Verrouille'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
      security: []
  /auth/totp/activation:
    post:
      tags:
      - Authentification
      summary: Démarrer l'activation TOTP
      operationId: post_auth_totp_activation
      description: 'Exigences : RF-003. Bearer = access token, ou jeton intermédiaire `totp_activation` reçu à la
        connexion (activation obligatoire avant la première connexion console d''un membre du bureau). 409 si le TOTP
        est déjà actif.'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  otpauthUrl:
                    type: string
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /auth/totp/confirmation:
    post:
      tags:
      - Authentification
      summary: Confirmer TOTP et obtenir les codes de secours
      operationId: post_auth_totp_confirmation
      description: 'Exigences : RF-003. Les 10 codes de secours ne sont affichés qu''une fois. Appelée avec le jeton
        intermédiaire `totp_activation`, termine aussi la connexion : `session` est alors présente (et le cookie de
        refresh posé pour la console). Code incorrect : 422 VALIDATION (champ `code`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
              - code
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  codesSecours:
                    type: array
                    items:
                      type: string
                  session:
                    $ref: '#/components/schemas/Session'
                required:
                - codesSecours
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /auth/refresh:
    post:
      tags:
      - Authentification
      summary: Renouveler l'access token
      operationId: post_auth_refresh
      description: 'Console : cookie HttpOnly `assoflow_refresh` (Path=/v1/auth) + en-tête `X-Requested-With:
        assoflow-console`, corps `{}`. Mobile : refreshToken dans le corps. Rotation à chaque usage ; la présentation
        d''un refresh déjà utilisé révoque toute la session (401 SESSION_REVOQUEE).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
      security: []
  /auth/deconnexion:
    post:
      tags:
      - Authentification
      summary: Se déconnecter (révoque la session)
      operationId: post_auth_deconnexion
      responses:
        '204':
          description: Succès sans contenu
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /auth/moi:
    get:
      tags:
      - Authentification
      summary: Profil et accès de l'utilisateur connecté
      operationId: get_auth_moi
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurMoi'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        default:
          $ref: '#/components/responses/Erreur'
  /auth/contexte:
    post:
      tags:
      - Authentification
      summary: Choisir l'association active
      operationId: post_auth_contexte
      description: 'Renvoie un nouvel access token portant `aid` (le refresh token n''est pas renouvelé). 403
        ACCES_REVOQUE sans accès actif au mandat en cours. À la connexion, l''association est choisie d''office si
        l''utilisateur n''en a qu''une.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                associationId:
                  type: string
                  format: uuid
              required:
              - associationId
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /auth/appareils:
    post:
      tags:
      - Authentification
      summary: Enregistrer un appareil mobile
      operationId: post_auth_appareils
      description: 'Exigences : RNF-001.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnregistrementAppareil'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appareil'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /association:
    get:
      tags:
      - Association
      summary: Profil de l'association active
      operationId: get_association
      description: 'Permission : `association.lire`. Exigences : RF-010, RF-011.'
      responses:
        '200':
          description: Succès
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Association'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        default:
          $ref: '#/components/responses/Erreur'
    patch:
      tags:
      - Association
      summary: Modifier le profil et les paramètres
      operationId: patch_association
      description: 'Permission : `association.modifier`. Exigences : RF-ADM-020, RF-ADM-024. RG-ASS-003 : `seuilDoubleValidation` modifiable par le président uniquement (403 sinon).
        Concurrence optimiste : `If-Match` (valeur de l''`ETag` ou du champ `etag`) obligatoire depuis la console.'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssociationMaj'
      responses:
        '200':
          description: Succès
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Association'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '422':
          $ref: '#/components/responses/Invalide'
        '412':
          $ref: '#/components/responses/PreconditionEchouee'
        '428':
          $ref: '#/components/responses/PreconditionRequise'
        default:
          $ref: '#/components/responses/Erreur'
  /association/logo:
    put:
      tags:
      - Association
      summary: Remplacer le logo (multipart)
      operationId: put_association_logo
      description: 'Permission : `association.modifier`. PNG, JPEG ou WebP (type vérifié sur le contenu), 2 Mo maximum.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fichier:
                  type: string
                  format: binary
              required:
              - fichier
      responses:
        '200':
          description: Succès
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Association'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /exercices:
    get:
      tags:
      - Association
      summary: Lister les exercices
      operationId: get_exercices
      description: 'Permission : `association.lire`. Exigences : RF-012, RF-014.'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exercice'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        default:
          $ref: '#/components/responses/Erreur'
    post:
      tags:
      - Association
      summary: Créer un exercice
      operationId: post_exercices
      description: 'Permission : `exercice.gerer`. Exigences : RF-ADM-022.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Exercice'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercice'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /exercices/{id}/cloturer:
    post:
      tags:
      - Association
      summary: Clôturer un exercice
      operationId: post_exercices_id_cloturer
      description: 'Permission : `exercice.cloturer`. RG-EXE-003 : refusée (422 `DEPENSES_EN_COURS`) s''il reste des dépenses soumises ou validées rattachées à l''exercice ou datées dans sa période ; exercice déjà clôturé → 409 `ETAT_INCOMPATIBLE`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercice'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/NonTrouve'
        '422':
          $ref: '#/components/responses/Invalide'
        '409':
          $ref: '#/components/responses/Conflit'
        default:
          $ref: '#/components/responses/Erreur'
  /acces:
    get:
      tags:
      - Accès et rôles
      summary: Lister les accès (bureau et membres avec app)
      operationId: get_acces
      description: 'Permission : `utilisateur.lire`. Exigences : RF-ADM-010.'
      parameters:
      - name: statut
        in: query
        required: false
        schema:
          type: string
          enum:
          - actif
          - revoque
          - expire
      - name: roleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limite'
      - $ref: '#/components/parameters/Curseur'
      responses:
        '200':
          description: Page de résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAcces'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        default:
          $ref: '#/components/responses/Erreur'
    post:
      tags:
      - Accès et rôles
      summary: Inviter un utilisateur (crée le compte si besoin)
      operationId: post_acces
      description: 'Permission : `utilisateur.gerer`. Exigences : RF-ADM-010, RF-ADM-011.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccesInvitation'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acces'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /acces/{id}:
    patch:
      tags:
      - Accès et rôles
      summary: Changer de rôle ou de mandat
      operationId: patch_acces_id
      description: 'Permission : `utilisateur.gerer`. Exigences : RF-ADM-011, RF-ADM-013.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccesMaj'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acces'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/NonTrouve'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /acces/{id}/revoquer:
    post:
      tags:
      - Accès et rôles
      summary: Révoquer immédiatement un accès
      operationId: post_acces_id_revoquer
      description: 'Permission : `utilisateur.gerer`. Exigences : RF-ADM-014.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motif'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acces'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/NonTrouve'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /acces/{id}/deverrouiller:
    post:
      tags:
      - Accès et rôles
      summary: Déverrouiller le compte
      operationId: post_acces_id_deverrouiller
      description: 'Permission : `utilisateur.gerer`. Exigences : RF-005.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Succès sans contenu
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/NonTrouve'
        '422':
          $ref: '#/components/responses/Invalide'
        default:
          $ref: '#/components/responses/Erreur'
  /acces/{id}/connexions:
    get:
      tags:
      - Accès et rôles
      summary: Historique de connexion
      operationId: get_acces_id_connexions
      description: 'Permission : `utilisateur.lire`. Exigences : RF-ADM-015.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limite'
      - $ref: '#/components/parameters/Curseur'
      responses:
        '200':
          description: Page de résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEntreeAudit'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/NonTrouve'
        default:
          $ref: '#/components/responses/Erreur'
  /roles:
    get:
      tags:
      - Accès et rôles
      summary: Lister les rôles
      operationId: get_roles
      description: 'Permission : `utilisateur.lire`.'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        default:
          $ref: '#/components/responses/Erreur'
    post:
      tags:
      - Accès et rôles
      summary: Créer un rôle personnalisé
      operationId: post_roles
      description: 'Permission : `role.gerer`. Exigences : RF-ADM-012.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
      responses:
