components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limite:
      name: limite
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Curseur:
      name: curseur
      in: query
      schema:
        type: string
      description: Curseur opaque renvoyé par la page précédente
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
      description: Clé unique (UUID) ; rejouer la même requête renvoie la même réponse pendant 7 jours
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Valeur de l'`ETag` (ou du champ `etag`) lue avant la modification. Obligatoire depuis la console
        (428 `PRECONDITION_REQUISE` sinon) ; 412 `PRECONDITION_ECHOUEE` si la ressource a changé depuis (docs/07 §5).
  headers:
    ETag:
      description: Version opaque de la ressource, à renvoyer dans `If-Match` (identique au champ `etag` du corps)
      schema:
        type: string
  responses:
    PreconditionEchouee:
      description: La ressource a été modifiée depuis sa lecture (PRECONDITION_ECHOUEE) — relire puis réessayer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    PreconditionRequise:
      description: En-tête If-Match obligatoire depuis la console (PRECONDITION_REQUISE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    NonAuthentifie:
      description: Jeton absent, expiré ou révoqué
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Interdit:
      description: Permission insuffisante ou accès révoqué
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    NonTrouve:
      description: Ressource introuvable (y compris d'un autre tenant)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Conflit:
      description: Conflit d'idempotence (CONFLIT_IDEMPOTENCE) ou transition d'état impossible (ETAT_INCOMPATIBLE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Invalide:
      description: Données invalides ou règle de gestion violée
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Erreur:
      description: Erreur
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Verrouille:
      description: Compte verrouillé après des échecs consécutifs (COMPTE_VERROUILLE)
      headers:
        Retry-After:
          description: Secondes avant la fin du verrouillage
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
    TropDeRequetes:
      description: Plus de 3 demandes d'OTP pour ce numéro en 15 min (TROP_DE_REQUETES)
      headers:
        Retry-After:
          description: Secondes avant de pouvoir redemander un code
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erreur'
  schemas:
    Erreur:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Code stable, ex. VALIDATION, EXERCICE_FERME (voir 07-contrat-api.md §4)
        detail:
          type: string
        requestId:
          type: string
        erreurs:
          type: array
          items:
            type: object
            properties:
              champ:
                type: string
              code:
                type: string
              message:
                type: string
              ref:
                type:
                - string
                - 'null'
                description: Identifiant d'une ressource liée (ex. fiche existante d'un doublon probable)
      required:
      - type
      - title
      - status
      - code
      description: Problem Details (RFC 9457), media type application/problem+json
    PageInfo:
      type: object
      properties:
        curseurSuivant:
          type:
          - string
          - 'null'
        total:
          type:
          - integer
          - 'null'
      required:
      - curseurSuivant
    AccesResume:
      type: object
      properties:
        associationId:
          type: string
          format: uuid
        associationNom:
          type: string
        role:
          type: object
          properties:
            code:
              type: string
            libelle:
              type: string
          required:
          - code
          - libelle
        permissions:
          type: array
          items:
            type: string
      required:
      - associationId
      - associationNom
      - role
      - permissions
    UtilisateurMoi:
      type: object
      properties:
        id:
          type: string
          format: uuid
        telephone:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          description: Téléphone E.164
          example: '+2250701020304'
        email:
          type:
          - string
          - 'null'
        nom:
          type: string
        prenoms:
          type: string
        totpActif:
          type: boolean
