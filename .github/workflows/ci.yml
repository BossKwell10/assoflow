name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assoflow_owner
          POSTGRES_PASSWORD: assoflow
          POSTGRES_DB: assoflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U assoflow_owner -d assoflow"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://assoflow_owner:assoflow@localhost:5432/assoflow
      DATABASE_APP_URL: postgres://assoflow_app:assoflow@localhost:5432/assoflow
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Migrations sur base vide
        run: |
          pnpm db:migrate
          pnpm db:migrate   # idempotence
          psql "$DATABASE_URL" -c "ALTER ROLE assoflow_app PASSWORD 'assoflow'"
      - run: pnpm turbo run lint typecheck test build

  images:
    name: Images Docker
    needs: verifier
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, console]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan de vulnérabilités
        # Tag au format vX.Y.Z (la forme sans « v » n'existe pas) ; épinglé sur le commit de v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Référence produite par metadata-action, déjà en minuscules (BossKwell10 → bosskwell10)
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
